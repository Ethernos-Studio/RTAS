[project]
name = "eyes-of-priestess"
version = "0.1.0"
description = "EYESOFPRIESTESS：战场感知数据管线 + 检测模型（YOLO 粗类 / SAM 出框 / ByteTrack）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "imageio-ffmpeg>=0.8.1",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# 检测训练 / SAM 出框 / 跟踪都要 ultralytics（会带 torch；下面 uv.sources 固定 CUDA 版）
train = [
    "ultralytics>=8.3",
    "torch>=2.1",
    "torchvision>=0.16",
    "lap>=0.5.12",          # ByteTrack 的匹配算法，ultralytics 不会自动装
]
# Label Studio 体积大（几百 MB），标注时才装
annotate = ["label-studio>=1.13"]
# offline copy-paste 增强（可选）
aug = ["albumentations>=1.4"]

[project.scripts]
radar = "eyesofpriestess.cli:main"
eop = "eyesofpriestess.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eyesofpriestess"]

[tool.uv]
# 训练机上默认 CUDA 版 torch，避免 CPU/GPU 两个轮子来回换
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]
